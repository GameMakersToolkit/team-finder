version: '3.6'

services:
  api:
    container_name: team-finder-api
    build: ./api
    restart: on-failure
    depends_on:
      - db
    ports:
      - "8080:8080"
    env_file:
      - ./.env
    environment:
      # Optional runtime flags override; default keeps only telemetry agent wiring.
      JAVA_OPTS: "${API_JAVA_OPTS:--javaagent:/app/otel-agent.jar}"

  ui:
    container_name: team-finder-ui
    build:
      context: ./ui
      dockerfile: Dockerfile.dev
    restart: on-failure
    ports:
      - "3000:3000"
    env_file:
      - ./.env
    volumes:
      - ./ui:/app

  db:
    image: postgres:16-alpine
    container_name: team-finder-db
    restart: always
    environment:
      POSTGRES_USER: team_finder
      POSTGRES_PASSWORD: team_finder_password
      POSTGRES_DB: team_finder
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  db-seed:
    build: ./db/seed
    container_name: team-finder-db-seed
    depends_on:
      - db
    environment:
      PGHOST: db
      PGPORT: 5432
      PGUSER: team_finder
      PGPASSWORD: team_finder_password
      PGDATABASE: team_finder

  db-viewer:
    image: dpage/pgadmin4:latest
    container_name: team-finder-db-viewer
    restart: always
    ports:
      - "8081:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@example.com
      PGADMIN_DEFAULT_PASSWORD: admin
    volumes:
      - pgadmin_data:/var/lib/pgadmin

volumes:
  postgres_data:
  pgadmin_data:
