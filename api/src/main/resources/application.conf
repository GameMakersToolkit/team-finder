ktor {
    application {
        modules = [
            com.gmtkgamejam.KoinModuleKt.koinModule,
            com.gmtkgamejam.AuthModuleKt.authModule,
            com.gmtkgamejam.ApplicationKt.appModule
        ]
    }
    deployment {
        port = 8080
    }
    # Production-safe default; enable locally with KTOR_DEVELOPMENT=true when needed.
    development = false
    development = ${?KTOR_DEVELOPMENT}
}

jwt {
    secret = "secret"
    secret = ${?APP_JWT_SECRET}
    issuer = "http://0.0.0.0:8080/"
    audience = "http://0.0.0.0:8080/hello"
    sessionLifespanMs = 86400000
    sessionLifespanMs = ${?APP_JWT_SESSION_LIFESPAN_MS}
}

cors {
    allowedOrigins = "http://localhost:3000,https://findyourjam.team"
    allowedOrigins = ${?CORS_ALLOWED_ORIGINS}
}

rateLimit {
    postMutationsPerMinute = 30
    postMutationsPerMinute = ${?POST_MUTATIONS_PER_MINUTE}
}

secrets {
    discord {
        client {
            id = ${DISCORD_CLIENT_ID}
            secret = ${DISCORD_CLIENT_SECRET}
        }
    }

    database {
        url = ${DATABASE_URL}
    }

    auth {
        encryptionKeyBase64 = ${AUTH_ENCRYPTION_KEY_BASE64}
    }
}

api {
    host = ${API_URL}
}

ui {
    host = ${UI_URL}
}

bot {
    pingChannel = "jam-team-notifs"
    pingChannel = ${?DISCORD_NOTIFICATION_CHANNEL}

    token = default_token_to_let_app_start
    token = ${?DISCORD_BOT_TOKEN}

    userRateLimit = 20
    userRateLimit = ${?DISCORD_BOT_USER_RATE_LIMIT}

    perRecipientRateLimit = 3600
    perRecipientRateLimit = ${?DISCORD_BOT_PER_RECIPIENT_RATE_LIMIT}
}

uploadthingKey = ${?UPLOADTHING_SECRET_KEY}
